name: Publicar GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # La clave de Gemini NO se configura aquí: quedaría visible en el sitio.
      # El asistente usa el proxy cuyo URL se guarda en la variable AI_PROXY_URL.
      - name: Configurar asistente de IA
        env:
          AI_PROXY_URL: ${{ vars.AI_PROXY_URL }}
          AI_PROXY_TOKEN: ${{ vars.AI_PROXY_TOKEN }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: |
          echo "VITE_GEMINI_MODEL=${AI_MODEL:-gemini-3.8-flash}" >> "$GITHUB_ENV"
          if [ -n "$AI_PROXY_URL" ]; then
            echo "VITE_AI_PROXY_URL=$AI_PROXY_URL" >> "$GITHUB_ENV"
          else
            echo "::warning::AI_PROXY_URL no está configurado. El asistente pedirá una clave en el navegador."
          fi
          if [ -n "$AI_PROXY_TOKEN" ]; then
            echo "VITE_AI_PROXY_TOKEN=$AI_PROXY_TOKEN" >> "$GITHUB_ENV"
          fi
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
